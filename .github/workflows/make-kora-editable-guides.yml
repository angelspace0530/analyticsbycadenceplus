name: Generate GitHub-editable Kora guides
on:
  push:
    branches: [docs/kora-2025-github-editable]
    paths:
      - 'scripts/make_kora_editable_guides.py'
      - '.github/workflows/make-kora-editable-guides.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/kora-2025-github-editable
      - run: python -m pip install --quiet pymupdf
      - run: python scripts/make_kora_editable_guides.py
      - name: Verify source content
        run: |
          python - <<'PY'
          from pathlib import Path
          b=Path('project packs/Kora/Kora - 2025 only')
          a=(b/'Kora 2025 Project Guide.md').read_text()
          c=(b/'Kora 2025 Database Setup Guide.md').read_text()
          for keyword in ['Sales demand and cancellations','Delivery reliability','Expected deliverables','Database Schema']:
              assert keyword.lower() in a.lower(),keyword
          for keyword in ['SQLite','SQL Server','PostgreSQL','MySQL','What a successful load looks like']:
              assert keyword.lower() in c.lower(),keyword
          assert (b/'Kora 2025 Database Schema.png').exists()
          print('Approved PDF text converted to GitHub-editable Markdown')
          PY
      - name: Commit editable source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'project packs/Kora/Kora - 2025 only'
          git commit -m 'Add editable Markdown versions of Kora 2025 guides'
          git push origin HEAD:docs/kora-2025-github-editable
