name: Keep Kora 2025 project ZIP in sync
on:
  push:
    branches: [main]
    paths:
      - 'project packs/Kora/Kora - 2025 only/**'
      - 'scripts/package_kora_editable.py'
      - '.github/workflows/package-kora-editable.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kora-2025-zip-main
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Build complete ZIP and verify exact folder contents
        run: python scripts/package_kora_editable.py
      - name: Commit only the refreshed project ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'project packs/Kora/Kora - 2025 only/Kora-2025-only.zip'
          if ! git diff --cached --quiet; then
            git commit -m 'Sync Kora 2025 ZIP with current project files'
            git push origin HEAD:main
          else
            echo 'ZIP already matches repository contents'
          fi
